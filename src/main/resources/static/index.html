<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoWorkHub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E7D5B'/%3E%3Crect x='7' y='14' width='18' height='4' rx='2' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Inicio de sesión -->
  <main id="login" class="login" hidden>
    <section class="login-card">
      <h1 class="brand">CoWorkHub</h1>
      <p class="login-lead">Reserva salas, revisa tus horas del mes y gestiona el coworking.</p>
      <div class="day-strip" aria-hidden="true">
        <span style="--from:3;--to:5"></span><span style="--from:6;--to:7"></span><span style="--from:9;--to:12"></span>
      </div>
      <form id="login-form" class="stack">
        <label>Usuario <input name="username" autocomplete="username" required autofocus></label>
        <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button class="btn primary" type="submit">Iniciar sesión</button>
      </form>
      <details class="hint">
        <summary>Usuarios de prueba</summary>
        <p><code>admin</code> / <code>admin123</code>, <code>recepcion</code> / <code>recepcion123</code>,
          <code>ana</code> / <code>ana123</code>, <code>carlos</code> / <code>carlos123</code></p>
      </details>
    </section>
  </main>

  <!-- Panel -->
  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <p class="brand small">CoWorkHub</p>
      <nav id="nav" aria-label="Secciones"></nav>
      <div class="who">
        <p id="who-name"></p>
        <p id="who-role" class="muted"></p>
        <button id="logout" class="btn ghost" type="button">Cerrar sesión</button>
      </div>
    </aside>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <dialog id="dialog">
    <div class="dialog-head">
      <h2 id="dialog-title"></h2>
      <button class="btn ghost icon" type="button" data-close aria-label="Cerrar">✕</button>
    </div>
    <div id="dialog-body"></div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
