spring.application.name=coworkhub
server.port=8084

# Secretos locales (contraseña real de la BD, etc.) fuera de git
spring.config.import=optional:file:./local.properties

# Conexion con MySQL en Docker
spring.datasource.url=jdbc:mysql://localhost:3306/coworkhub
spring.datasource.username=coworkhub
spring.datasource.password=${DB_PASSWORD:coworkhub}

# JPA / Hibernate: create borra y recrea las tablas y ejecuta import.sql en cada arranque
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health

# Swagger
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.swagger-ui.urls-primary-name=Toda la API
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha

# Propiedades del negocio
coworkhub.zone-id=America/Bogota
coworkhub.jwt.secret=${JWT_SECRET:cambiar-este-secreto-de-desarrollo-de-32-bytes-o-mas}
coworkhub.jwt.expiration-minutes=60
